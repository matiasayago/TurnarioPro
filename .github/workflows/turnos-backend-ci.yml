name: Turnos Profesionales - Backend CI

# CI del backend de TURNOS-2026-001 (proyectos/turnos-profesionales/05-codigo/backend).
# Fase 6 (DevOps) - ver proyectos/turnos-profesionales/08-despliegue/README.md para el
# detalle completo de lo que valida este workflow y por que esta dividido en dos jobs.

on:
  push:
    paths:
      - "proyectos/turnos-profesionales/05-codigo/backend/**"
      - ".github/workflows/turnos-backend-ci.yml"
  pull_request:
    paths:
      - "proyectos/turnos-profesionales/05-codigo/backend/**"
      - ".github/workflows/turnos-backend-ci.yml"

defaults:
  run:
    working-directory: proyectos/turnos-profesionales/05-codigo/backend

env:
  # src/db.ts usa el modulo built-in `node:sqlite`, disponible recien desde Node >=22.5 (ver
  # README.md del backend y memory/proyectos/turnos-profesionales/decisiones.md). No bajar
  # de 22 aca sin revisar tambien el Dockerfile (node:22-slim) - tienen que ir coordinados.
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------------------
  # Job 1: valida el CODIGO FUENTE - tipado estricto + la bateria completa de scripts de
  # prueba (business logic + regresiones de seguridad ya remediadas, ver
  # 07-seguridad/informe-seguridad.md). Corre contra ts-node (igual que `npm run dev`,
  # sin pasar por dist/) para dar feedback rapido sin depender del layout del build.
  # ---------------------------------------------------------------------------------------
  build-and-test:
    name: Build + type-check + bateria de scripts
    runs-on: ubuntu-latest
    # `contents: write` habilita el ultimo paso (comentario en el commit con los logs de una
    # falla) - mismo motivo/patron que turnos-mobile-ci.yml (ver ese workflow, commit cb20d12).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: proyectos/turnos-profesionales/05-codigo/backend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Type-check estricto (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Compilar (npm run build) - detecta errores de build ademas de tipos
        run: npm run build

      # ── Bateria de scripts/*.mjs (~10 scripts) ──────────────────────────────────────
      # OJO: no alcanza con UN solo arranque del servidor. scripts/test-rn8-ventana-
      # cancelacion.mjs esta disenado a proposito contra la ventana de cancelacion
      # DEFAULT (120 min, ver src/routes/turnos.ts) y FALLA si se lo corre con
      # VENTANA_CANCELACION_MIN=0 (que es justamente lo que necesitan los otros 9
      # scripts para no depender de esperar minutos reales) - confirmado en este ciclo
      # reproduciendo el fallo real antes de escribir este workflow, no es algo teorico.
      # Por eso este job levanta el servidor DOS veces, tal como documenta el propio
      # README.md del backend ("Scripts de prueba (actualizado)").

      - name: "Fase 1/2 - arrancar servidor (ventanas en 0, rate limit alto, dev routes on)"
        env:
          PORT: "3000"
          EXPIRACION_PAGO_MIN: "0"
          VENTANA_CANCELACION_MIN: "0"
          ENABLE_DEV_ROUTES: "true"
          RATE_LIMIT_LOGIN_MAX: "1000"
          RATE_LIMIT_REGISTRO_MAX: "1000"
        run: |
          # Invocar el binario de node_modules/.bin DIRECTO, no "npx ts-node" (ver el comentario
          # largo en el paso "detener servidor" de mas abajo para la causa raiz completa) - esto
          # es lo que hace que "$!" mas abajo capture el PID real del servidor.
          node_modules/.bin/ts-node --transpile-only src/index.ts > server-fase1.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Servidor (fase 1) arriba."
              exit 0
            fi
            sleep 1
          done
          echo "El servidor (fase 1) no respondio /health a tiempo."
          cat server-fase1.log
          exit 1

      - name: "Fase 1/2 - correr todos los scripts salvo test-rn8-ventana-cancelacion"
        run: |
          set +e
          {
            for f in scripts/*.mjs; do
              case "$f" in
                scripts/test-rn8-ventana-cancelacion.mjs) continue ;;
              esac
              echo "== Corriendo $f =="
              node "$f" || exit 1
            done
          } > scripts-fase1.log 2>&1
          code=$?
          cat scripts-fase1.log
          exit $code

      - name: "Fase 1/2 - logs del servidor (si algo fallo)"
        if: failure()
        run: cat server-fase1.log || true

      - name: "Fase 1/2 - detener servidor y limpiar la DB"
        if: always()
        run: |
          # CAUSA RAIZ CONFIRMADA del fallo real de este job (run 31108620102 - reproducido en
          # local antes de este fix, ver memory/proyectos/turnos-profesionales/decisiones.md):
          # el paso anterior arrancaba el servidor con "npx ts-node ... &" y guardaba "$!" como
          # el PID a matar acá. Pero "npx" SIEMPRE hace spawn de un proceso hijo real para correr
          # un binario local (nunca reemplaza su propio proceso vía exec), así que "$!" capturaba
          # el PID del WRAPPER de npx, no el del proceso de Node que realmente terminaba
          # bindeando el puerto 3000 — matar solo ese wrapper dejaba el servidor real HUÉRFANO Y
          # VIVO (confirmado con dos pruebas de control en local: matando el PID de "$!" con
          # "npx ts-node", el servidor seguía respondiendo 5+ segundos después y quedaban
          # procesos node.exe vivos; con el binario de node_modules/.bin/ invocado DIRECTO, sin
          # npx, el mismo kill terminaba el proceso real en ~1s sin huérfanos). Ya arreglado en
          # la raíz en el paso anterior (binario directo, no "npx") — el `kill -0` de acá abajo
          # queda como defensa adicional por si el proceso tarda un poco en terminar de verdad,
          # no como el fix principal.
          if [ -f server.pid ]; then
            PID="$(cat server.pid)"
            kill "$PID" 2>/dev/null || true
            for i in $(seq 1 20); do
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
              sleep 0.5
            done
            if kill -0 "$PID" 2>/dev/null; then
              echo "El servidor (PID $PID) no terminó a tiempo tras SIGTERM, forzando con SIGKILL."
              kill -9 "$PID" 2>/dev/null || true
              sleep 1
            fi
          fi
          rm -f server.pid dev.sqlite3 dev.sqlite3-*

      - name: "Fase 2/2 - arrancar servidor limpio (ventana de cancelacion DEFAULT = 120 min)"
        env:
          PORT: "3000"
          ENABLE_DEV_ROUTES: "true"
          RATE_LIMIT_LOGIN_MAX: "1000"
          RATE_LIMIT_REGISTRO_MAX: "1000"
        run: |
          # Mismo motivo que en "Fase 1/2 - arrancar servidor": binario directo, no "npx".
          node_modules/.bin/ts-node --transpile-only src/index.ts > server-fase2.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Servidor (fase 2) arriba."
              exit 0
            fi
            sleep 1
          done
          echo "El servidor (fase 2) no respondio /health a tiempo."
          cat server-fase2.log
          exit 1

      - name: "Fase 2/2 - correr test-rn8-ventana-cancelacion (necesita la ventana default)"
        run: |
          set +e
          node scripts/test-rn8-ventana-cancelacion.mjs > scripts-fase2-rn8.log 2>&1
          code=$?
          cat scripts-fase2-rn8.log
          exit $code

      - name: "Fase 2/2 - logs del servidor (si algo fallo)"
        if: failure()
        run: cat server-fase2.log || true

      - name: "Fase 2/2 - detener servidor"
        if: always()
        run: |
          # Mismo criterio que "Fase 1/2 - detener servidor y limpiar la DB" (ver el comentario
          # largo ahí): esperar a que el proceso realmente termine antes de seguir, en vez de
          # asumirlo tras el "kill". Acá no hay un tercer arranque en el mismo puerto dentro de
          # este job, pero se mantiene por consistencia y para no reintroducir el mismo patrón
          # fragil si en el futuro se agrega una Fase 3.
          if [ -f server.pid ]; then
            PID="$(cat server.pid)"
            kill "$PID" 2>/dev/null || true
            for i in $(seq 1 20); do
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
              sleep 0.5
            done
            kill -9 "$PID" 2>/dev/null || true
          fi
          rm -f server.pid dev.sqlite3 dev.sqlite3-*

      # Este entorno de desarrollo no tiene forma de leer logs de Actions: la API de descarga
      # de logs devuelve 403 "Must have admin rights to Repository" aun en un repo publico y
      # sin autenticacion (mismo bloqueo ya documentado en turnos-mobile-ci.yml, commit
      # cb20d12 - confirmado de nuevo puntualmente para este job al diagnosticar el run
      # 31108620102). Mismo workaround: publicamos los logs ya capturados en archivo por los
      # pasos de arriba como comentario en el commit que disparo el run, usando el
      # GITHUB_TOKEN que Actions provee automaticamente (permiso contents:write otorgado en
      # este job) - ese comentario si se puede leer despues sin login via la API publica (GET
      # /repos/{owner}/{repo}/commits/{sha}/comments).
      #
      # OJO (hallazgo de este ciclo, ver memory/proyectos/turnos-profesionales/decisiones.md):
      # la version anterior envolvia cada log en "<details><summary>...</summary>...
      # </details>". Eso SI queda en el body como texto plano (no como archivo adjunto - la
      # API de comentarios de commit no tiene ningun concepto de adjunto), pero <details> se
      # renderiza COLAPSADO por default: sin hacer click para expandirlo, lo unico que se ve
      # es el titulo del comentario y el nombre del archivo (el "resumen"), nunca el contenido
      # real del log. Se saca <details> por completo: el bloque de codigo va SIEMPRE visible,
      # sin ningun click ni sesion iniciada necesarios. Se agrega ademas truncado por lineas
      # (ultimas 200, con un tope extra en bytes por archivo) y un tope total del body: la
      # version anterior podia superar el limite de tamano de un comentario de GitHub si mas
      # de un archivo llegaba al maximo de 55000 bytes a la vez, lo que hubiera hecho fallar
      # el POST silenciosamente (sin romper el job, porque este paso no revisa el status code
      # de curl) - no era el problema de ESTE incidente puntual, pero es la misma clase de
      # "el mecanismo de diagnostico no muestra lo que necesito" que se esta corrigiendo aca.
      - name: "Publicar logs del job como comentario del commit (si algo fallo)"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### turnos-backend-ci.yml / build-and-test - run ${{ github.run_id }} (${{ github.event_name }}, commit ${{ github.sha }})"
            echo
            for f in server-fase1.log scripts-fase1.log server-fase2.log scripts-fase2-rn8.log; do
              if [ -s "$f" ]; then
                echo "#### $f (ultimas 200 lineas)"
                echo
                echo '```'
                tail -n 200 "$f" | tail -c 20000
                echo '```'
                echo
              fi
            done
          } > /tmp/comment-body.md
          node -e "
            const fs = require('fs');
            let body = fs.readFileSync('/tmp/comment-body.md', 'utf8');
            const MAX = 60000;
            if (body.length > MAX) {
              body = '_(comentario truncado - se muestran los ultimos ' + MAX + ' caracteres)_\n\n' + body.slice(-MAX);
            }
            fs.writeFileSync('/tmp/comment-body.json', JSON.stringify({ body }));
          "
          curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/comment-body.json

  # ---------------------------------------------------------------------------------------
  # Job 2: valida el ARTEFACTO EMPAQUETADO (el Dockerfile de verdad, no el codigo suelto).
  # Este es el unico lugar donde este proyecto puede validar el Dockerfile con Docker real:
  # el entorno de desarrollo de DevOps no tiene Docker instalado (ver 08-despliegue/
  # README.md), pero los runners de GitHub Actions si lo traen preinstalado. Corre en
  # config "tipo produccion" (NODE_ENV=production del propio Dockerfile, sin
  # ENABLE_DEV_ROUTES) para que este smoke test sea representativo de un despliegue real.
  # ---------------------------------------------------------------------------------------
  docker-build-smoke:
    name: Build de imagen Docker + smoke test end-to-end
    runs-on: ubuntu-latest
    needs: build-and-test
    # `contents: write` habilita el ultimo paso (comentario en el commit con los logs de una
    # falla) - mismo motivo/patron que el job build-and-test de este mismo workflow.
    permissions:
      contents: write
    # Nota operativa (visto en el run 31115744124): este job puede fallar directo en el paso
    # interno "Set up job" (lo genera GitHub, no un step de este archivo) con las anotaciones
    # "Failed to resolve action download info." / "Internal Server Error", sin atarse a ninguna
    # linea real de este YAML. Es un hiccup transitorio del servicio de Actions al resolver
    # `actions/checkout@v4`, no un defecto de este workflow - confirmado revisando las
    # annotations del check-run (GET /repos/.../check-runs/{id}/annotations, sin login) antes de
    # tocar nada por esa causa. Ante ese patron puntual, reintentar (nuevo push) en vez de
    # buscar un bug en el codigo.
    # Este job pisa el default de workflow (working-directory: backend/) por la raiz del
    # repo: `docker build <path>` necesita el path relativo a la raiz, no al backend. El
    # paso de smoke test de mas abajo vuelve a pisarlo puntualmente hacia backend/ porque
    # ese si necesita correr `node scripts/smoke-test.mjs` desde ahi.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OJO (hallazgo de este ciclo): antes este paso no capturaba su propia salida a ningun
      # archivo. Cuando "docker build" fallaba de verdad (run 31117318338, commit 389fe65 -
      # ver memory/proyectos/turnos-profesionales/decisiones.md), el paso de diagnostico de
      # mas abajo no tenia NADA que publicar sobre la causa real: el unico archivo no vacio
      # terminaba siendo docker-container.log con el ruido de "No such container" (el
      # contenedor nunca llego a crearse). Se captura aca para que el comentario del commit
      # muestre el error real de "docker build", no solo ese efecto secundario.
      - name: Build de la imagen (Dockerfile multi-stage)
        run: |
          set +e
          docker build \
            -t turnos-profesionales-backend:ci \
            proyectos/turnos-profesionales/05-codigo/backend \
            > docker-build.log 2>&1
          code=$?
          cat docker-build.log
          exit $code

      - name: "Levantar el contenedor (config tipo produccion - sin ENABLE_DEV_ROUTES)"
        run: |
          set +e
          docker run -d \
            --name turnos-backend-ci \
            -p 3000:3000 \
            -e JWT_SECRET="ci-smoke-test-secret-nunca-usar-en-produccion" \
            turnos-profesionales-backend:ci \
            > docker-run.log 2>&1
          code=$?
          cat docker-run.log
          exit $code

      - name: Esperar a que el HEALTHCHECK / GET /health responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Contenedor arriba."
              exit 0
            fi
            sleep 1
          done
          echo "El contenedor no respondio /health a tiempo."
          docker logs turnos-backend-ci > docker-container.log 2>&1 || true
          cat docker-container.log || true
          exit 1

      - name: Smoke test end-to-end contra el contenedor real
        working-directory: proyectos/turnos-profesionales/05-codigo/backend
        run: |
          set +e
          node scripts/smoke-test.mjs > smoke-test.log 2>&1
          code=$?
          cat smoke-test.log
          exit $code

      - name: Logs del contenedor (si algo fallo)
        if: failure()
        run: |
          docker logs turnos-backend-ci > docker-container.log 2>&1 || true
          cat docker-container.log || true

      - name: Apagar y borrar el contenedor
        if: always()
        run: docker rm -f turnos-backend-ci || true

      # Mismo bloqueo de logs de Actions sin login que en el job build-and-test de este mismo
      # workflow (y en turnos-mobile-ci.yml, commit cb20d12) - mismo workaround, y misma
      # correccion de este ciclo (ver el comentario largo en el paso equivalente del job
      # build-and-test, mas arriba, para el detalle completo de por que se saca <details>).
      # Se agregan ademas docker-build.log/docker-run.log a la lista de archivos: antes solo
      # se publicaban docker-container.log y smoke-test.log, asi que si "docker build" o
      # "docker run" fallaban (en vez del healthcheck o el smoke test), el comentario
      # quedaba vacio de informacion util - exactamente lo que paso en el run 31117318338
      # (commit 389fe65), ver memory/proyectos/turnos-profesionales/decisiones.md.
      - name: "Publicar logs del job como comentario del commit (si algo fallo)"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### turnos-backend-ci.yml / docker-build-smoke - run ${{ github.run_id }} (${{ github.event_name }}, commit ${{ github.sha }})"
            echo
            for f in docker-build.log docker-run.log docker-container.log proyectos/turnos-profesionales/05-codigo/backend/smoke-test.log; do
              if [ -s "$f" ]; then
                echo "#### $f (ultimas 200 lineas)"
                echo
                echo '```'
                tail -n 200 "$f" | tail -c 20000
                echo '```'
                echo
              fi
            done
          } > /tmp/comment-body.md
          node -e "
            const fs = require('fs');
            let body = fs.readFileSync('/tmp/comment-body.md', 'utf8');
            const MAX = 60000;
            if (body.length > MAX) {
              body = '_(comentario truncado - se muestran los ultimos ' + MAX + ' caracteres)_\n\n' + body.slice(-MAX);
            }
            fs.writeFileSync('/tmp/comment-body.json', JSON.stringify({ body }));
          "
          curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/comment-body.json
