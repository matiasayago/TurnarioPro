name: Turnos Profesionales - Mobile CI

# CI del cliente mobile de TURNOS-2026-001 (proyectos/turnos-profesionales/05-codigo/mobile).
# Este codigo Flutter se escribio a mano y nunca se habia compilado ni corrido: el entorno de
# desarrollo de Mobile no tiene el SDK de Flutter/Dart instalado (ver README.md de este
# directorio y memory/proyectos/turnos-profesionales/decisiones.md). Este workflow usa el SDK
# oficial de Flutter (subosito/flutter-action, gratis dentro de los minutos incluidos de
# GitHub Actions) para obtener, por primera vez, verificacion real del compilador.

on:
  push:
    paths:
      - "proyectos/turnos-profesionales/05-codigo/mobile/**"
      - ".github/workflows/turnos-mobile-ci.yml"
  pull_request:
    paths:
      - "proyectos/turnos-profesionales/05-codigo/mobile/**"
      - ".github/workflows/turnos-mobile-ci.yml"

defaults:
  run:
    working-directory: proyectos/turnos-profesionales/05-codigo/mobile

jobs:
  # ---------------------------------------------------------------------------------------
  # Un unico job: pub get + analyze (type-check estatico) + build de un APK debug (sin
  # firmar). Solo Android, no iOS: alcanza para validar el codigo Dart (toda la logica de
  # este slice vive en lib/, compartida) y un runner macOS para iOS consume minutos de
  # Actions a 10x sin aportar cobertura adicional sobre el Dart en si.
  # ---------------------------------------------------------------------------------------
  analyze-and-build:
    name: pub get + flutter analyze + build APK (debug)
    runs-on: ubuntu-latest
    # `contents: write` habilita el ultimo paso (comentario en el commit con el log de una
    # falla) - ver el comentario de ese paso para el motivo.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pubspec.yaml declara `sdk: '>=3.3.0 <4.0.0'` (environment.sdk). El canal stable de
      # Flutter siempre trae una version de Dart dentro de ese rango (Dart 4.0 todavia no
      # existe), asi que alcanza con seguir stable en vez de fijar una version puntual.
      - name: Setup Flutter (channel stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: flutter --version
        run: flutter --version

      # HISTORIAL (2026-08-14): hasta la ronda de HU-29 "Turnario Pro", este proyecto se escribia
      # a mano (solo lib/ + pubspec.yaml) sin correr nunca `flutter create`, asi que le faltaba
      # android/ - este workflow lo generaba en cada corrida con `flutter create
      # --platforms=android .` y despues borraba test/widget_test.dart/analysis_options.yaml
      # (plantilla generica que `flutter create` completa de yapa, sin relacion con este
      # proyecto). Google Play Billing (HU-29) necesitaba android/ real y permanente con un
      # `applicationId` especifico (com.turnariopro.app, ver
      # ../../proyectos/turnos-profesionales/08-despliegue/google-play-billing.md) - no algo que
      # se sintetice distinto en cada corrida de CI. android/ ya esta commiteado en el repo desde
      # esa ronda, con su propio test/widget_test.dart y analysis_options.yaml REALES (no
      # plantilla) - los dos pasos que hacian ese trabajo temporal se sacaron de aca: generar
      # android/ de nuevo seria redundante (`flutter create` no pisa lo que ya existe, pero ya no
      # hace falta llamarlo) y borrar test/analysis_options.yaml ahora borraria archivos
      # legitimos del repo, no plantilla.
      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: |
          set +e
          flutter analyze > /tmp/flutter-analyze.log 2>&1
          code=$?
          cat /tmp/flutter-analyze.log
          exit $code

      - name: flutter build apk --debug
        run: |
          set +e
          flutter build apk --debug > /tmp/flutter-build.log 2>&1
          code=$?
          cat /tmp/flutter-build.log
          exit $code

      # Este entorno de desarrollo no tiene forma de leer logs de Actions: la API de descarga
      # de logs devuelve 403 "Must have admin rights to Repository" aun en un repo publico y
      # sin autenticacion (comprobado activamente, no es una suposicion), y no hay un token
      # disponible para autenticar la llamada. Como workaround, publicamos la salida ya
      # capturada de los pasos de arriba como un comentario en el commit que disparo el run,
      # usando el GITHUB_TOKEN que Actions provee automaticamente (con permiso contents:write
      # otorgado arriba) - esos comentarios si son legibles despues via la API publica sin
      # autenticacion (GET /repos/{owner}/{repo}/commits/{sha}/comments).
      #
      # OJO (hallazgo de este ciclo en turnos-backend-ci.yml, mismo patron aca - ver
      # memory/proyectos/turnos-profesionales/decisiones.md): la version anterior envolvia
      # cada log en "<details><summary>...</summary>...</details>". Eso queda en el body como
      # texto plano (no como archivo adjunto - esta API no tiene ningun concepto de adjunto),
      # pero <details> se renderiza COLAPSADO por default: sin hacer click para expandirlo,
      # solo se ve el titulo del comentario y el nombre de cada log, nunca el contenido real.
      # Se saca <details>: el bloque de codigo va siempre visible, sin click ni sesion
      # iniciada. Se agrega tambien truncado por lineas (ultimas 200, con tope extra en
      # bytes) y un tope total del body, para no arriesgar superar el limite de tamano de un
      # comentario de GitHub si ambos logs fueran grandes a la vez.
      - name: "Publicar salida de flutter analyze/build como comentario del commit (si algo fallo)"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### turnos-mobile-ci.yml - run ${{ github.run_id }} (${{ github.event_name }}, commit ${{ github.sha }})"
            echo
            if [ -s /tmp/flutter-analyze.log ]; then
              echo "#### flutter analyze (ultimas 200 lineas)"
              echo
              echo '```'
              tail -n 200 /tmp/flutter-analyze.log | tail -c 20000
              echo '```'
              echo
            fi
            if [ -s /tmp/flutter-build.log ]; then
              echo "#### flutter build apk --debug (ultimas 200 lineas)"
              echo
              echo '```'
              tail -n 200 /tmp/flutter-build.log | tail -c 20000
              echo '```'
              echo
            fi
          } > /tmp/comment-body.md
          node -e "
            const fs = require('fs');
            let body = fs.readFileSync('/tmp/comment-body.md', 'utf8');
            const MAX = 60000;
            if (body.length > MAX) {
              body = '_(comentario truncado - se muestran los ultimos ' + MAX + ' caracteres)_\n\n' + body.slice(-MAX);
            }
            fs.writeFileSync('/tmp/comment-body.json', JSON.stringify({ body }));
          "
          curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/comment-body.json
