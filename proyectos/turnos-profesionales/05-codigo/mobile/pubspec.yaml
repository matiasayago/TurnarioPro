name: turnos_profesionales
description: App mobile de reserva de turnos (Cliente/Profesional) - TURNOS-2026-001
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  intl: ^0.19.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  # Task #114 (Mercado Pago): abre la URL de checkout devuelta por `POST /turnos/:id/pago` en el
  # navegador del sistema (`confirmar_turno_screen.dart`, `_abrirCheckoutDeMercadoPago`) — ver
  # pub.dev/packages/url_launcher, última versión estable verificada contra la API de pub.dev al
  # agregar esta dependencia (2026-08-23).
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # HU-35 (login con Google, ver lib/widgets/google_logo.dart): logo oficial de Google ("G"
  # multicolor), publicado por Google para armar botones de "Sign in with Google" propios (ver
  # developers.google.com/identity/branding-guidelines) — se bundlea localmente en vez de
  # referenciarlo por URL para no depender de red en cada render ni acoplar el login a que
  # Google siga sirviendo ese archivo en esa URL.
  #
  # Branding real de la app (logo provisto por el CEO, ver flutter_launcher_icons.yaml /
  # flutter_native_splash.yaml para íconos/splash): se declara acá solo `icon.png`, que es el
  # que además se usa en runtime vía `Image.asset` en `LoginScreen`. `adaptive-icon.png` y
  # `splash-icon.png` (misma imagen) no se listan porque sólo los consumen los generadores de
  # íconos/splash en build-time, no el código Dart en runtime.
  assets:
    - assets/branding/google_logo.png
    - assets/icon/icon.png
